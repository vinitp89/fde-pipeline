name: Data Pipeline CI/CD

on:
  push:
    branches:
      - main 

jobs:
  build-and-test:
    runs-on: ubuntu-latest 
    
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Step C: Install your pipeline requirements AND the testing framework
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      # Step D: Execute your test script
      - name: Run Unit Tests
        run: pytest test_pipeline.py

      # Step E: Build the image ONLY if the tests pass
      - name: Build Docker Image
        run: docker build -t fde-pipeline:latest .